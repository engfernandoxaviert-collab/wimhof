<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wim Hof Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:sans-serif;background:#0f172a;color:#fff;min-height:100vh;
       display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
  .tela{display:none;width:100%;max-width:420px}
  .ativa{display:block}
  h1{margin-bottom:24px}
  h3{margin:20px 0 8px;color:#94a3b8;font-weight:normal}
  button{width:100%;padding:18px;margin:8px 0;border:none;border-radius:14px;
         font-size:1.2rem;background:#38bdf8;color:#0f172a;font-weight:bold}
  button.sec{background:#334155;color:#fff}
  button.verm{background:#f43f5e;color:#fff}
  .circulo{width:200px;height:200px;border-radius:50%;background:#38bdf8;margin:30px auto;
           display:flex;align-items:center;justify-content:center;font-size:3rem;color:#0f172a;
           transition:transform 1.5s ease-in-out}
  .grande{transform:scale(1.2)} .pequeno{transform:scale(.8)}
  .reten{background:#a78bfa} .recup{background:#22c55e}
  .opcoes{display:flex;gap:10px}
  .opcoes button{font-size:1rem;padding:14px 4px}
  .opcoes button.sel{background:#22c55e}
  input[type=range]{width:100%;margin:10px 0;accent-color:#38bdf8}
  .hist{text-align:left;background:#1e293b;padding:12px;border-radius:10px;margin:6px 0;font-size:.9rem}
  canvas{width:100%;background:#1e293b;border-radius:12px;margin-bottom:12px}
  .leg{font-size:.85rem;margin-bottom:10px}
  .leg span{margin:0 8px}
  #lista{max-height:35vh;overflow-y:auto}
  #blocoVel.off{opacity:.35;pointer-events:none}
</style>
</head>
<body>

<div id="inicio" class="tela ativa">
  <h1>🧊 Wim Hof</h1>
  <p id="infoRounds" style="margin-bottom:20px"></p>
  <button onclick="iniciar()">▶ Começar</button>
  <button class="sec" onclick="mostrar('config')">⚙ Configuração</button>
  <button class="sec" onclick="verHistorico()">📈 Evolução</button>
</div>

<div id="config" class="tela">
  <h1>⚙ Configuração</h1>
  <h3>Rounds</h3>
  <div class="opcoes" id="optRounds">
    <button data-v="3" onclick="setRounds(3)">3</button>
    <button data-v="4" onclick="setRounds(4)">4</button>
    <button data-v="5" onclick="setRounds(5)">5</button>
  </div>
  <h3>Respiração guiada (30x)</h3>
  <div class="opcoes" id="optGuiada">
    <button data-v="1" onclick="setGuiada(1)">Sim</button>
    <button data-v="0" onclick="setGuiada(0)">Não</button>
  </div>
  <div id="blocoVel">
    <h3>Velocidade da respiração</h3>
    <div class="opcoes" id="optVel">
      <button data-v="2.25" onclick="setVel(2.25)">🐢 Lenta</button>
      <button data-v="1.5" onclick="setVel(1.5)">Normal</button>
      <button data-v="1" onclick="setVel(1)">🐇 Rápida</button>
    </div>
    <input type="range" id="slider" min="1" max="3" step="0.25" oninput="setVel(+this.value)">
    <p id="velTxt"></p>
  </div>
  <button class="sec" onclick="mostrar('inicio')">Voltar</button>
</div>

<div id="sessao" class="tela">
  <h2 id="fase"></h2>
  <div id="circ" class="circulo">0</div>
  <p id="dica"></p>
  <button id="btnAcao"></button>
  <button class="sec" onclick="cancelar()">✖ Cancelar</button>
</div>

<div id="historico" class="tela">
  <h1>Evolução</h1>
  <canvas id="grafico" width="400" height="250"></canvas>
  <div class="leg"><span style="color:#38bdf8">● Melhor</span><span style="color:#a78bfa">● Média</span></div>
  <div id="lista"></div>
  <button class="sec" onclick="mostrar('inicio')">Voltar</button>
</div>

<script>
let rounds = +localStorage.getItem('rounds') || 3;
let vel = +localStorage.getItem('vel') || 1.5;
let guiada = localStorage.getItem('guiada')===null ? 1 : +localStorage.getItem('guiada');
let roundAtual, tempos, timer;
const RESP = 30, REC = 15;
const $ = id => document.getElementById(id);
const vibrar = ms => navigator.vibrate && navigator.vibrate(ms);

function mostrar(id){
  document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  $(id).classList.add('ativa');
  $('infoRounds').textContent = `Rounds:
